<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art robot head on a 16×16 grid. -->
  <!-- Antenna -->
  <rect x="7" y="0" width="2" height="2" fill="#f43f5e"/>
  <rect x="7" y="2" width="2" height="1" fill="#1e1b4b"/>
  <!-- Ears -->
  <rect x="0" y="6" width="2" height="5" fill="#1e1b4b"/>
  <rect x="14" y="6" width="2" height="5" fill="#1e1b4b"/>
  <rect x="1" y="7" width="1" height="3" fill="#a5b4fc"/>
  <rect x="14" y="7" width="1" height="3" fill="#a5b4fc"/>
  <!-- Head -->
  <rect x="2" y="3" width="12" height="11" fill="#1e1b4b"/>
  <rect x="3" y="4" width="10" height="9" fill="#818cf8"/>
  <rect x="3" y="4" width="10" height="1" fill="#a5b4fc"/>
  <!-- Eyes -->
  <rect x="5" y="6" width="2" height="2" fill="#22d3ee"/>
  <rect x="9" y="6" width="2" height="2" fill="#22d3ee"/>
  <rect x="5" y="6" width="1" height="1" fill="#ecfeff"/>
  <rect x="9" y="6" width="1" height="1" fill="#ecfeff"/>
  <!-- Mouth grille -->
  <rect x="5" y="10" width="6" height="1" fill="#1e1b4b"/>
  <rect x="6" y="10" width="1" height="1" fill="#c7d2fe"/>
  <rect x="9" y="10" width="1" height="1" fill="#c7d2fe"/>
  <!-- Neck -->
  <rect x="6" y="14" width="4" height="2" fill="#1e1b4b"/>
</svg>
