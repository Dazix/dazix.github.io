<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vibecoding · sanda.dev</title>
    <meta name="description" content="Small web apps and experiments by David Šanda." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --card: #0f172a;
          --border: #1e293b;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --accent: #818cf8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: max(3rem, env(safe-area-inset-top)) 1rem 3rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 0 2rem;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }
      a.card {
        display: flex;
        gap: 1rem;
        align-items: center;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--card);
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s;
      }
      a.card:hover,
      a.card:focus-visible {
        border-color: var(--accent);
      }
      a.card img {
        width: 3rem;
        height: 3rem;
        flex-shrink: 0;
      }
      .card h2 {
        margin: 0;
        font-size: 1rem;
      }
      .card p {
        margin: 0.125rem 0 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      footer {
        margin-top: 3rem;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vibecoding</h1>
      <p class="lead">Small web apps and experiments. Everything runs in the browser, no backend.</p>

      <ul>
        <li>
          <a class="card" href="/indoor-navigation/">
            <img src="/indoor-navigation/pwa-192x192.png" alt="" width="48" height="48" />
            <div>
              <h2>Indoor Navigation</h2>
              <p>
                Office navigation PWA with on-device visual localization (MobileNet), QR markers, AR compass
                and step tracking.
              </p>
            </div>
          </a>
        </li>
      </ul>

      <footer>
        David Šanda · <a href="https://github.com/Dazix">github.com/Dazix</a>
      </footer>
    </main>
  </body>
</html>
